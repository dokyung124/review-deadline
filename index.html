<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>리뷰 마감 알리미</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="리뷰마감" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#2FA58A" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    --bg:#F6F8F5; --card:#fff; --ink:#1F2A27; --sub:#6B7A75; --line:#E4EAE6;
    --main:#2FA58A; --main-soft:#E3F4EE; --red:#E5534B; --red-soft:#FDECEA;
    --amber:#E89A2C; --amber-soft:#FDF3E2; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 110px}
  .hidden{display:none!important}

  /* 헤더 */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  header h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.3px}
  header h1 span{color:var(--main)}
  .icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:18px}

  /* 요약 */
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .sum{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
  .sum b{display:block;font-size:24px;font-weight:800;margin-top:2px}
  .sum small{color:var(--sub);font-size:12.5px}
  .sum.today b{color:var(--red)} .sum.week b{color:var(--amber)} .sum.over b{color:var(--sub)}

  /* 보기 전환 + 필터 */
  .seg{display:flex;background:#E9EFEC;border-radius:12px;padding:3px;margin-bottom:10px}
  .seg button{flex:1;padding:8px;border-radius:10px;font-weight:600;color:var(--sub)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--sub)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chips.acct{margin-top:-4px}
  .chips.acct .chip{padding:5px 11px;font-size:12.5px}
  .chips.acct .chip.on{background:var(--main);border-color:var(--main)}
  .acct-tag{background:var(--main-soft);color:var(--main);border-radius:6px;padding:1px 7px;font-weight:700;margin-left:4px}
  .ver{text-align:center;color:var(--sub);font-size:12px;margin-top:12px}

  /* 목록 */
  .sec-title{font-size:13.5px;font-weight:700;color:var(--sub);margin:18px 4px 8px;display:flex;justify-content:space-between}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 13px 13px 14px;display:flex;gap:12px;align-items:center;margin-bottom:8px}
  .card.done{opacity:.5}
  .card.done .title{text-decoration:line-through}
  .dbadge{flex:none;width:58px;text-align:center;border-radius:12px;padding:8px 0;font-weight:800;font-size:14px;background:var(--main-soft);color:var(--main)}
  .dbadge small{display:block;font-weight:600;font-size:11px;opacity:.85;margin-top:1px}
  .dbadge.today{background:var(--red);color:#fff}
  .dbadge.soon{background:var(--amber-soft);color:var(--amber)}
  .dbadge.over{background:var(--red-soft);color:var(--red)}
  .dbadge.done{background:#EEF1EF;color:var(--sub)}
  .info{flex:1;min-width:0}
  .site{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--sub)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .title{font-weight:650;margin:3px 0 2px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .meta{font-size:12.5px;color:var(--sub)}
  .acts{display:flex;flex-direction:column;gap:6px}
  .act{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;font-size:15px;background:#fff}
  .act.check.on{background:var(--main);border-color:var(--main);color:#fff}
  .empty{text-align:center;color:var(--sub);padding:40px 10px;line-height:1.7}
  .more{width:100%;padding:11px;border-radius:12px;border:1px dashed var(--line);color:var(--sub);font-weight:600;margin-top:4px}

  /* 달력 */
  .cal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-head b{font-size:16px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-grid .wd{text-align:center;font-size:12px;color:var(--sub);padding:4px 0}
  .day{aspect-ratio:1/1.05;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding-top:5px;font-size:13.5px}
  .day.other{opacity:.3}
  .day.today .n{background:var(--ink);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
  .day.sel{background:var(--main-soft)}
  .day .dots{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap;justify-content:center;max-width:30px}
  .day .dots i{width:6px;height:6px;border-radius:50%}
  .day .cnt{font-size:10.5px;font-weight:700;color:var(--red);margin-top:2px}

  /* 추가 버튼 */
  .fab{position:fixed;right:max(18px, calc(50% - 262px));bottom:calc(env(safe-area-inset-bottom) + 22px);width:58px;height:58px;border-radius:20px;background:var(--main);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(47,165,138,.35);display:grid;place-items:center}

  /* 시트(모달) */
  .backdrop{position:fixed;inset:0;background:rgba(20,30,27,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow:auto}
  .sheet h2{margin:0 0 14px;font-size:18px}
  label.f{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:12px 0 6px}
  .in{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#FAFCFB;font-size:16px}
  textarea.in{min-height:70px;resize:vertical}
  .row{display:flex;gap:8px}
  .btn{flex:1;padding:13px;border-radius:13px;font-weight:700;background:#EEF2F0}
  .btn.main{background:var(--main);color:#fff}
  .btn.red{background:var(--red-soft);color:var(--red)}
  .btns{display:flex;gap:8px;margin-top:18px}
  .set-box{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .set-box h3{margin:0 0 4px;font-size:15px}
  .set-box p{margin:0 0 10px;color:var(--sub);font-size:13px;line-height:1.55}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .tog{width:50px;height:30px;border-radius:999px;background:#D6DEDA;position:relative;flex:none;transition:.2s}
  .tog::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .tog.on{background:var(--main)} .tog.on::after{left:23px}
  code.token{display:block;background:#F2F5F3;border-radius:10px;padding:10px;font-size:11.5px;word-break:break-all;color:var(--sub);margin-bottom:8px}

  /* 로그인 */
  .login{max-width:380px;margin:12vh auto 0;padding:0 20px}
  .login .logo{font-size:44px;text-align:center}
  .login h1{text-align:center;margin:8px 0 4px;font-size:23px}
  .login p{text-align:center;color:var(--sub);margin:0 0 22px}
  .link{display:block;text-align:center;margin-top:14px;color:var(--sub);font-size:14px;text-decoration:underline}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw;text-align:center;line-height:1.45}
</style>
</head>
<body>

<!-- 로그인 화면 -->
<section id="loginView" class="login hidden">
  <div class="logo">⏰</div>
  <h1>리뷰 마감 알리미</h1>
  <p>체험단 리뷰 마감일을 한곳에서</p>
  <input id="email" class="in" type="email" placeholder="이메일" autocomplete="username" />
  <div style="height:8px"></div>
  <input id="pw" class="in" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" />
  <div class="btns"><button id="loginBtn" class="btn main">로그인</button></div>
  <a href="#" id="toggleSignup" class="link">처음이에요 · 회원가입</a>
</section>

<!-- 메인 화면 -->
<main id="appView" class="wrap hidden">
  <header>
    <h1>리뷰 <span>마감</span> 알리미</h1>
    <button class="icon-btn" id="openSettings" aria-label="설정">⚙️</button>
  </header>

  <div class="summary">
    <div class="sum today"><small>오늘 마감</small><b id="sumToday">0</b></div>
    <div class="sum week"><small>7일 이내</small><b id="sumWeek">0</b></div>
    <div class="sum over"><small>마감 지남</small><b id="sumOver">0</b></div>
  </div>

  <div class="seg">
    <button data-view="list" class="on">목록</button>
    <button data-view="cal">달력</button>
  </div>
  <div class="chips" id="siteChips"></div>
  <div class="chips acct" id="acctChips"></div>

  <div id="listView"></div>
  <div id="calView" class="hidden"></div>
</main>

<button class="fab hidden" id="fab" aria-label="직접 추가">＋</button>

<!-- 추가/수정 시트 -->
<div class="backdrop hidden" id="editSheet">
  <div class="sheet">
    <h2 id="editTitle">체험단 추가</h2>
    <label class="f">사이트</label>
    <select id="fSite" class="in"></select>
    <label class="f">계정 (같은 사이트 아이디가 여러 개일 때)</label>
    <input id="fAccount" class="in" list="acctList" placeholder="예) 두루미1 · 비워두면 구분 없음" />
    <datalist id="acctList"></datalist>
    <label class="f">제품 / 캠페인명</label>
    <input id="fTitle" class="in" placeholder="예) 촉촉 수분크림 구매평" />
    <label class="f">리뷰 마감일</label>
    <input id="fDeadline" class="in" type="date" />
    <label class="f">캠페인 링크 (선택)</label>
    <input id="fUrl" class="in" type="url" placeholder="https://" />
    <label class="f">메모 (선택)</label>
    <textarea id="fMemo" class="in" placeholder="가이드 키워드, 사진 장수 등"></textarea>
    <div class="btns">
      <button class="btn red hidden" id="delBtn">삭제</button>
      <button class="btn" data-close>취소</button>
      <button class="btn main" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<!-- 설정 시트 -->
<div class="backdrop hidden" id="setSheet">
  <div class="sheet">
    <h2>설정</h2>

    <div class="set-box">
      <div class="switch">
        <div><h3>마감 당일 알림</h3><p style="margin:0">오늘 마감인 리뷰가 있으면 알려드려요</p></div>
        <button class="tog" id="notifyTog" aria-label="알림 켜기"></button>
      </div>
      <label class="f">알림 시간</label>
      <input type="time" id="notifyTime" class="in" step="300" />
      <div class="btns">
        <button class="btn" id="pushBtn">알림 받기 등록</button>
        <button class="btn" id="testBtn">테스트 알림</button>
      </div>
      <p style="margin:10px 0 0" id="pushState"></p>
    </div>

    <div class="set-box">
      <h3>유저스크립트 연결 코드</h3>
      <p>체험단 사이트에서 마감일을 자동으로 보내주는 유저스크립트에 이 코드를 한 번만 붙여넣으면 돼요. 남에게 알려주지 마세요.</p>
      <code class="token" id="connCode"></code>
      <div class="row">
        <button class="btn" id="copyConn">코드 복사</button>
        <button class="btn" id="resetToken">코드 새로 만들기</button>
      </div>
    </div>

    <div class="btns">
      <button class="btn" id="logoutBtn">로그아웃</button>
      <button class="btn main" data-close>닫기</button>
    </div>
    <p class="ver">앱 버전 1.3 · 계정 표시 지원</p>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_ANON_KEY, VAPID_PUBLIC_KEY } from "./config.js";

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (s) => document.querySelector(s);

const SITES = ["리뷰플레이스", "구구다스", "스타일씨", "클라우드리뷰", "리워딩스", "아싸뷰", "리뷰노트", "기타"];
const SITE_COLOR = {
  "리뷰플레이스": "#FF7A59", "구구다스": "#6C8CFF", "스타일씨": "#E35D9B", "클라우드리뷰": "#3DB4E0",
  "리워딩스": "#9B6BE8", "아싸뷰": "#F2B233", "리뷰노트": "#2FA58A", "기타": "#9AA7A2",
};
const colorOf = (s) => SITE_COLOR[s] || SITE_COLOR["기타"];
const WD = ["일", "월", "화", "수", "목", "금", "토"];

const state = {
  user: null, items: [], settings: null,
  filter: "전체", acct: "전체", view: "list", showDone: false,
  calMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1), selDay: null,
  editing: null, signup: false,
};

/* ---------- 날짜 도우미 ---------- */
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const dayDiff = (s) => Math.round((Date.parse(s) - Date.parse(todayStr())) / 86400000);
const fmtDate = (s) => { const d = new Date(s + "T00:00:00"); return `${d.getMonth() + 1}/${d.getDate()} (${WD[d.getDay()]})`; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg, ms = 2400) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

/* ---------- 로그인 ---------- */
async function boot() {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  const { data: { session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e, s) => { if (!s) showLogin(); });
  session ? enter(session.user) : showLogin();
}

function showLogin() {
  state.user = null;
  $("#loginView").classList.remove("hidden");
  $("#appView").classList.add("hidden");
  $("#fab").classList.add("hidden");
}

$("#toggleSignup").onclick = (e) => {
  e.preventDefault();
  state.signup = !state.signup;
  $("#loginBtn").textContent = state.signup ? "회원가입" : "로그인";
  $("#toggleSignup").textContent = state.signup ? "이미 계정이 있어요 · 로그인" : "처음이에요 · 회원가입";
};

$("#loginBtn").onclick = async () => {
  const email = $("#email").value.trim(), password = $("#pw").value;
  if (!email || password.length < 6) return toast("이메일과 6자 이상 비밀번호를 입력해주세요");
  const fn = state.signup ? sb.auth.signUp({ email, password }) : sb.auth.signInWithPassword({ email, password });
  const { data, error } = await fn;
  if (error) return toast(error.message.includes("Invalid") ? "이메일 또는 비밀번호가 맞지 않아요" : error.message);
  if (!data.session) return toast("메일 인증이 켜져 있어요. Supabase에서 Confirm email을 꺼주세요", 4000);
  enter(data.session.user);
};

async function enter(user) {
  state.user = user;
  $("#loginView").classList.add("hidden");
  $("#appView").classList.remove("hidden");
  $("#fab").classList.remove("hidden");
  await Promise.all([loadItems(), loadSettings()]);
  render();
}

/* ---------- 데이터 ---------- */
async function loadItems() {
  const { data, error } = await sb.from("rd_campaigns").select("*").order("deadline", { ascending: true });
  if (error) return toast("불러오기 실패: " + error.message);
  state.items = data || [];
}

async function loadSettings() {
  let { data } = await sb.from("rd_settings").select("*").maybeSingle();
  if (!data) ({ data } = await sb.from("rd_settings").insert({}).select().single());
  state.settings = data;
}

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && state.user) { await loadItems(); render(); }
});

/* ---------- 화면 그리기 ---------- */
function visibleItems() {
  return state.items.filter((i) => (state.filter === "전체" || i.site === state.filter) && (state.acct === "전체" || (i.account || "") === state.acct));
}

function badge(i) {
  const d = dayDiff(i.deadline);
  if (i.done) return `<div class="dbadge done">완료<small>${fmtDate(i.deadline).split(" ")[0]}</small></div>`;
  if (d === 0) return `<div class="dbadge today">D-DAY<small>오늘</small></div>`;
  if (d < 0) return `<div class="dbadge over">D+${-d}<small>지남</small></div>`;
  return `<div class="dbadge ${d <= 3 ? "soon" : ""}">D-${d}<small>${fmtDate(i.deadline).split(" ")[0]}</small></div>`;
}

function cardHTML(i) {
  return `<div class="card ${i.done ? "done" : ""}" data-id="${i.id}">
    ${badge(i)}
    <div class="info" data-edit>
      <span class="site"><i class="dot" style="background:${colorOf(i.site)}"></i>${esc(i.site)}${i.account ? `<span class="acct-tag">👤 ${esc(i.account)}</span>` : ""}</span>
      <div class="title">${esc(i.title)}</div>
      <div class="meta">마감 ${fmtDate(i.deadline)}${i.memo ? " · " + esc(i.memo).slice(0, 30) : ""}</div>
    </div>
    <div class="acts">
      <button class="act check ${i.done ? "on" : ""}" data-done aria-label="완료">✓</button>
      ${i.url ? `<button class="act" data-open aria-label="링크 열기">↗</button>` : ""}
    </div>
  </div>`;
}

function renderSummary() {
  const open = state.items.filter((i) => !i.done);
  $("#sumToday").textContent = open.filter((i) => dayDiff(i.deadline) === 0).length;
  $("#sumWeek").textContent = open.filter((i) => { const d = dayDiff(i.deadline); return d >= 0 && d <= 7; }).length;
  $("#sumOver").textContent = open.filter((i) => dayDiff(i.deadline) < 0).length;
}

function renderChips() {
  const used = new Set(state.items.map((i) => i.site));
  const list = ["전체", ...SITES.filter((s) => used.has(s)), ...[...used].filter((s) => !SITES.includes(s))];
  $("#siteChips").innerHTML = list.map((s) =>
    `<button class="chip ${state.filter === s ? "on" : ""}" data-site="${esc(s)}">${s === "전체" ? "" : `<i class="dot" style="background:${colorOf(s)};margin-right:5px"></i>`}${esc(s)}</button>`
  ).join("");
}

function renderAcctChips() {
  const inSite = state.items.filter((i) => state.filter === "전체" || i.site === state.filter);
  const accts = [...new Set(inSite.map((i) => i.account || "").filter(Boolean))].sort();
  if (state.acct !== "전체" && !accts.includes(state.acct)) state.acct = "전체";
  const el = $("#acctChips");
  el.classList.toggle("hidden", accts.length === 0);
  el.innerHTML = ["전체", ...accts].map((a) =>
    `<button class="chip ${state.acct === a ? "on" : ""}" data-acct="${esc(a)}">${a === "전체" ? "모든 계정" : "👤 " + esc(a)}</button>`).join("");
}

function renderList() {
  const items = visibleItems();
  const open = items.filter((i) => !i.done);
  const groups = [
    ["⚠️ 마감 지남 (아직 미완료)", open.filter((i) => dayDiff(i.deadline) < 0)],
    ["🔥 오늘 마감", open.filter((i) => dayDiff(i.deadline) === 0)],
    ["7일 이내", open.filter((i) => { const d = dayDiff(i.deadline); return d >= 1 && d <= 7; })],
    ["그 이후", open.filter((i) => dayDiff(i.deadline) > 7)],
  ];
  let html = groups.filter(([, arr]) => arr.length).map(([t, arr]) =>
    `<div class="sec-title"><span>${t}</span><span>${arr.length}건</span></div>${arr.map(cardHTML).join("")}`
  ).join("");

  if (!open.length) html = `<div class="empty">진행 중인 체험단이 없어요 🎉<br/>＋ 버튼으로 직접 추가하거나<br/>유저스크립트로 마감일을 불러오세요</div>`;

  const done = items.filter((i) => i.done).sort((a, b) => b.deadline.localeCompare(a.deadline));
  if (done.length) {
    html += `<button class="more" id="toggleDone">${state.showDone ? "완료한 리뷰 숨기기" : `완료한 리뷰 ${done.length}건 보기`}</button>`;
    if (state.showDone) html += `<div style="margin-top:8px">${done.slice(0, 60).map(cardHTML).join("")}</div>`;
  }
  $("#listView").innerHTML = html;
}

function renderCal() {
  const m = state.calMonth, y = m.getFullYear(), mo = m.getMonth();
  const start = new Date(y, mo, 1 - new Date(y, mo, 1).getDay());
  const byDay = {};
  visibleItems().forEach((i) => (byDay[i.deadline] ||= []).push(i));
  const today = todayStr();

  let cells = WD.map((w, idx) => `<div class="wd" style="${idx === 0 ? "color:var(--red)" : ""}">${w}</div>`).join("");
  for (let k = 0; k < 42; k++) {
    const d = new Date(start); d.setDate(start.getDate() + k);
    const key = ymd(d), list = byDay[key] || [];
    const open = list.filter((i) => !i.done);
    const dots = list.slice(0, 4).map((i) => `<i style="background:${colorOf(i.site)};${i.done ? "opacity:.35" : ""}"></i>`).join("");
    cells += `<button class="day ${d.getMonth() !== mo ? "other" : ""} ${key === today ? "today" : ""} ${state.selDay === key ? "sel" : ""}" data-day="${key}">
      <span class="n">${d.getDate()}</span><span class="dots">${dots}</span>${open.length > 1 ? `<span class="cnt">${open.length}</span>` : ""}</button>`;
    if (k === 34) { const nx = new Date(d); nx.setDate(d.getDate() + 1); if (nx.getMonth() !== mo) break; }
  }

  const sel = state.selDay ? (byDay[state.selDay] || []) : [];
  $("#calView").innerHTML = `<div class="cal">
      <div class="cal-head">
        <button class="icon-btn" data-mon="-1">‹</button>
        <b>${y}년 ${mo + 1}월</b>
        <button class="icon-btn" data-mon="1">›</button>
      </div>
      <div class="cal-grid">${cells}</div>
    </div>
    ${state.selDay ? `<div class="sec-title"><span>${fmtDate(state.selDay)} 마감</span><span>${sel.length}건</span></div>
      ${sel.length ? sel.map(cardHTML).join("") : `<div class="empty" style="padding:20px">이날 마감인 리뷰가 없어요</div>`}` : `<div class="empty" style="padding:22px">날짜를 누르면 그날 마감인 리뷰를 볼 수 있어요</div>`}`;
}

function render() {
  renderSummary(); renderChips(); renderAcctChips();
  $("#listView").classList.toggle("hidden", state.view !== "list");
  $("#calView").classList.toggle("hidden", state.view !== "cal");
  state.view === "list" ? renderList() : renderCal();
}

/* ---------- 이벤트 ---------- */
document.querySelectorAll(".seg button").forEach((b) => b.onclick = () => {
  state.view = b.dataset.view;
  document.querySelectorAll(".seg button").forEach((x) => x.classList.toggle("on", x === b));
  render();
});

$("#siteChips").onclick = (e) => {
  const c = e.target.closest("[data-site]"); if (!c) return;
  state.filter = c.dataset.site; render();
};
$("#acctChips").onclick = (e) => {
  const c = e.target.closest("[data-acct]"); if (!c) return;
  state.acct = c.dataset.acct; render();
};

document.body.addEventListener("click", async (e) => {
  if (e.target.id === "toggleDone") { state.showDone = !state.showDone; return renderList(); }
  const mon = e.target.closest("[data-mon]");
  if (mon) { state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() + Number(mon.dataset.mon), 1); return renderCal(); }
  const day = e.target.closest("[data-day]");
  if (day) { state.selDay = state.selDay === day.dataset.day ? null : day.dataset.day; return renderCal(); }

  const card = e.target.closest(".card"); if (!card) return;
  const item = state.items.find((i) => i.id === card.dataset.id); if (!item) return;
  if (e.target.closest("[data-done]")) {
    const done = !item.done;
    item.done = done; render();
    const { error } = await sb.from("rd_campaigns").update({ done }).eq("id", item.id);
    if (error) { item.done = !done; render(); toast("저장 실패: " + error.message); }
    else if (done) toast("리뷰 완료! 수고했어요 👏");
  } else if (e.target.closest("[data-open]")) {
    window.open(item.url, "_blank");
  } else if (e.target.closest("[data-edit]")) {
    openEdit(item);
  }
});

document.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => b.closest(".backdrop").classList.add("hidden"));
document.querySelectorAll(".backdrop").forEach((bd) => bd.addEventListener("click", (e) => { if (e.target === bd) bd.classList.add("hidden"); }));

/* ---------- 추가/수정 ---------- */
$("#fSite").innerHTML = SITES.map((s) => `<option>${s}</option>`).join("");
$("#fab").onclick = () => openEdit(null);

function openEdit(item) {
  state.editing = item;
  $("#editTitle").textContent = item ? "체험단 수정" : "체험단 추가";
  const site = item?.site || (state.filter !== "전체" ? state.filter : SITES[0]);
  if (![...$("#fSite").options].some((o) => o.value === site)) $("#fSite").insertAdjacentHTML("beforeend", `<option>${esc(site)}</option>`);
  $("#fSite").value = site;
  $("#fAccount").value = item ? (item.account || "") : (state.acct !== "전체" ? state.acct : "");
  $("#acctList").innerHTML = [...new Set(state.items.map((i) => i.account).filter(Boolean))].map((a) => `<option value="${esc(a)}">`).join("");
  $("#fTitle").value = item?.title || "";
  $("#fDeadline").value = item?.deadline || state.selDay || "";
  $("#fUrl").value = item?.url || "";
  $("#fMemo").value = item?.memo || "";
  $("#delBtn").classList.toggle("hidden", !item);
  $("#editSheet").classList.remove("hidden");
  if (!item) setTimeout(() => $("#fTitle").focus(), 50);
}

$("#saveBtn").onclick = async () => {
  const row = {
    site: $("#fSite").value, account: $("#fAccount").value.trim(), title: $("#fTitle").value.trim(), deadline: $("#fDeadline").value,
    url: $("#fUrl").value.trim() || null, memo: $("#fMemo").value.trim() || null,
  };
  if (!row.title) return toast("캠페인명을 입력해주세요");
  if (!row.deadline) return toast("리뷰 마감일을 골라주세요");
  const q = state.editing
    ? sb.from("rd_campaigns").update(row).eq("id", state.editing.id)
    : sb.from("rd_campaigns").insert({ ...row, source: "manual", external_id: crypto.randomUUID() });
  const { error } = await q;
  if (error) return toast("저장 실패: " + error.message);
  $("#editSheet").classList.add("hidden");
  await loadItems(); render();
  toast(state.editing ? "수정했어요" : "추가했어요");
};

$("#delBtn").onclick = async () => {
  if (!state.editing || !confirm("이 체험단을 삭제할까요?")) return;
  const { error } = await sb.from("rd_campaigns").delete().eq("id", state.editing.id);
  if (error) return toast("삭제 실패: " + error.message);
  $("#editSheet").classList.add("hidden");
  await loadItems(); render();
};

/* ---------- 설정 ---------- */
const connCode = () => btoa(JSON.stringify({ u: SUPABASE_URL, k: SUPABASE_ANON_KEY, t: state.settings?.ingest_token }));

async function refreshPushState() {
  let msg = "";
  if (!("PushManager" in window)) msg = "📱 아이폰은 Safari에서 '홈 화면에 추가'한 앱으로 열어야 알림을 켤 수 있어요.";
  else if (Notification.permission === "denied") msg = "알림이 차단되어 있어요. 아이폰 설정 > 알림 > 리뷰마감에서 허용해주세요.";
  else {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    msg = sub ? "✅ 이 기기에서 알림을 받고 있어요." : "이 기기는 아직 알림 등록 전이에요.";
  }
  $("#pushState").textContent = msg;
}

$("#openSettings").onclick = () => {
  const s = state.settings || {};
  $("#notifyTog").classList.toggle("on", !!s.notify_enabled);
  $("#notifyTime").value = (s.notify_time || "09:00").slice(0, 5);
  $("#connCode").textContent = connCode();
  $("#setSheet").classList.remove("hidden");
  refreshPushState();
};

async function saveSettings(patch) {
  const { data, error } = await sb.from("rd_settings").update({ ...patch, last_notified_on: null }).eq("user_id", state.user.id).select().single();
  if (error) return toast("설정 저장 실패: " + error.message);
  state.settings = data;
}

$("#notifyTog").onclick = async () => {
  const on = !$("#notifyTog").classList.contains("on");
  $("#notifyTog").classList.toggle("on", on);
  await saveSettings({ notify_enabled: on });
  toast(on ? "마감 당일 알림을 켰어요" : "알림을 껐어요");
};

$("#notifyTime").onchange = async () => {
  const v = $("#notifyTime").value; if (!v) return;
  await saveSettings({ notify_time: v + ":00" });
  toast(`매일 ${v}에 오늘 마감을 알려드릴게요`);
};

function b64ToUint8(b64) {
  const p = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + p).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

$("#pushBtn").onclick = async () => {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    return toast("아이폰은 Safari 공유 버튼 > '홈 화면에 추가' 후 그 앱에서 켜주세요", 4000);
  }
  const perm = await Notification.requestPermission();
  if (perm !== "granted") return toast("알림 권한을 허용해야 받을 수 있어요");
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToUint8(VAPID_PUBLIC_KEY) });
    const j = sub.toJSON();
    const { error } = await sb.from("rd_push_subscriptions").upsert(
      { user_id: state.user.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth },
      { onConflict: "endpoint" }
    );
    if (error) throw error;
    toast("이 기기에서 알림을 받을게요 🔔");
  } catch (err) {
    toast("알림 등록 실패: " + (err.message || err), 4000);
  }
  refreshPushState();
};

$("#testBtn").onclick = async () => {
  const { data, error } = await sb.functions.invoke("review-reminders", { body: { test: true } });
  if (error) return toast("테스트 실패: " + error.message, 4000);
  toast(data?.sent ? "테스트 알림을 보냈어요" : "등록된 기기가 없어요. 먼저 '이 기기에서 알림 받기'를 눌러주세요", 4000);
};

$("#copyConn").onclick = async () => {
  try { await navigator.clipboard.writeText(connCode()); toast("연결 코드를 복사했어요"); }
  catch { toast("길게 눌러서 직접 복사해주세요"); }
};

$("#resetToken").onclick = async () => {
  if (!confirm("새 코드를 만들면 기존 유저스크립트 연결이 끊겨요. 계속할까요?")) return;
  const token = crypto.randomUUID().replace(/-/g, "");
  const { data, error } = await sb.from("rd_settings").update({ ingest_token: token }).eq("user_id", state.user.id).select().single();
  if (error) return toast("실패: " + error.message);
  state.settings = data; $("#connCode").textContent = connCode();
  toast("새 연결 코드를 만들었어요. 유저스크립트에 다시 붙여넣어주세요", 3500);
};

$("#logoutBtn").onclick = async () => { await sb.auth.signOut(); $("#setSheet").classList.add("hidden"); showLogin(); };

boot();
</script>
</body>
</html>
